<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rocha Store · imagem de compartilhamento</title>
<meta name="robots" content="noindex">
<!-- Molde da imagem de compartilhamento (assets/img/og.jpg), 1200×630.
     Para regerar: abra esta página com a janela em 1200×630 e tire um print. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Geologica:wght@300..700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body { width: 1200px; height: 630px; min-height: 0; overflow: hidden; }
  .og { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 470px; align-items: center; height: 100%; padding: 0 80px; gap: 40px; }
  .og .topo { align-items: flex-start; text-align: left; }
  .og .emblema { width: 200px; margin-bottom: 26px; }
  .og .marca { font-size: 64px; }
  .og .slogan { font-size: 28px; margin-top: 18px; }
  .og .apresentacao { font-size: 20px; max-width: 30ch; }
  .og .ganchos { grid-template-columns: repeat(2, 1fr); gap: 26px 22px; }
  .og .etiqueta { padding-bottom: 20px; }
</style>
</head>
<body>
  <div class="og">
    <header class="topo">
      <div class="emblema" aria-hidden="true">
        <svg viewBox="0 0 200 160" class="emblema__svg">
          <defs>
            <linearGradient id="pedra" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#AEB3BC"/><stop offset="1" stop-color="#7A808B"/></linearGradient>
            <clipPath id="corte-celular"><rect x="0" y="0" width="200" height="148"/></clipPath>
          </defs>
          <path class="emblema__rocha" fill="url(#pedra)" d="M11.1 143.1L7.8 125.8Q6 116 9.5 106.6L13.8 95.2Q18 84 26.5 75.5L35.5 66.5Q44 58 54.1 51.5L67.9 42.5Q78 36 89.3 32L102.6 27.3Q112 24 121.7 26.2L128.3 27.8Q138 30 145.9 36.1L154.5 42.7Q164 50 170.3 60.2L179.7 75.8Q186 86 188.9 97.6L191.6 108.3Q194 118 192 127.8L189 143.1Q188 148 183 148L17 148Q12 148 11.1 143.1Z"/>
          <g clip-path="url(#corte-celular)">
            <rect x="57" y="54" width="86" height="120" rx="15" fill="#0E1116"/>
            <rect x="62" y="59" width="76" height="110" rx="11" fill="#FFFFFF"/>
            <rect x="84" y="59" width="32" height="8" rx="4" fill="#0E1116"/>
          </g>
          <text x="100" y="124" text-anchor="middle" class="emblema__rs">RS</text>
        </svg>
      </div>
      <h1 class="marca">Rocha Store<svg class="marca__raio" viewBox="0 0 24 32" aria-hidden="true"><path d="M14.5 1 3 18h7.5L8 31 21 12h-7.8z"/></svg></h1>
      <p class="slogan">Tecnologia que combina com você.</p>
      <p class="apresentacao">Eletrônicos, acessórios e produtos sob encomenda.</p>
    </header>
    <ul class="ganchos" data-ganchos></ul>
  </div>
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <defs>
      <linearGradient id="bolha" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EEF3FB"/><stop offset="1" stop-color="#D3DEF1"/></linearGradient>
      <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
      <clipPath id="corte-bolha"><path d="M9.3 86.1L7.2 72.9Q6 66 8.7 59.5L12.9 49.4Q16 42 21.9 36.6L32.1 27.4Q38 22 45.2 18.4L55.7 13.1Q62 10 69 10.7L75 11.3Q82 12 87.7 16.1L93.5 20.3Q100 25 104 31.9L108 39.1Q112 46 113.3 53.9L114.8 63.1Q116 70 114.6 76.9L112.8 86.1Q112 90 108 90L14 90Q10 90 9.3 86.1Z"/></clipPath>
    </defs>
  </svg>
  <script src="../assets/js/config.js"></script>
  <!-- só as 4 primeiras categorias, sem a cartela de encomenda -->
  <script>window.ROCHA.categorias = window.ROCHA.categorias.slice(0, 4);</script>
  <script src="../assets/js/main.js"></script>
  <script>
    const ultimo = document.querySelector('.etiqueta--vazia');
    if (ultimo) ultimo.closest('li').remove();
  </script>
</body>
</html>
